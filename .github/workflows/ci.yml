name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone — item 5.6/5.7 (check-sync-timestamps.mjs)
          # needs to read commit timestamps for files touched in public/data/**, and a
          # shallow clone can put the last commit touching a rarely-updated file outside
          # its range (TAD ADR-010). Doing it from the start avoids a later CI edit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run scan:secrets
