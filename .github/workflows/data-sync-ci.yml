name: Data Sync CI

on:
  push:
    paths:
      - 'public/data/**'
  pull_request:
    paths:
      - 'public/data/**'

jobs:
  validate-data:
    name: Validate Ingestion Contracts and Timestamps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for timestamp and git-history tolerance validation (item 5.7)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Data Schema Validation Gates
        run: npm run validate:data

      - name: Check Sync Timestamps
        run: npm run check:sync

      - name: Scan Secrets & PII Notes Leak
        run: npm run scan:secrets
